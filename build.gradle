plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'antlr'
}

group = 'kr.or.kosa'
version = '0.0.1-SNAPSHOT'
description = 'backend'

ext {
    springAiVersion = "1.1.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    // 필요할 때만 사용 (안정성 중요하면 제거 추천)
    maven { url 'https://repo.spring.io/milestone' }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/sources/antlr/main'
        }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {

    /* ------------------------
     * 🌱 Core
     * ------------------------ */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /* ------------------------
     * 🔐 Security & Auth
     * ------------------------ */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    /* JWT (안정 버전 유지) */
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /* ------------------------
     * 💾 DB & Redis
     * ------------------------ */
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /* ------------------------
     * 📧 Mail
     * ------------------------ */
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    /* ------------------------
     * ⚡ Async / WebSocket
     * ------------------------ */
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    /* ------------------------
     * 🤖 AI (Spring AI only 추천)
     * ------------------------ */
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'

    /* ------------------------
     * 🔍 ANTLR
     * ------------------------ */
    antlr "org.antlr:antlr4:4.13.1"
    implementation 'org.antlr:antlr4-runtime:4.13.1'

    /* ------------------------
     * ☁ AWS S3
     * ------------------------ */
    implementation 'software.amazon.awssdk:s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.0.2'

    /* ------------------------
     * 🧰 Utils
     * ------------------------ */
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.jsoup:jsoup:1.17.2'

    /* Word Cloud */
    implementation 'com.kennycason:kumo-core:1.28'
    implementation 'com.kennycason:kumo-tokenizers:1.28'

    /* Google OTP */
    implementation 'com.warrenstrange:googleauth:1.5.0'

    /* ------------------------
     * 🧪 Test
     * ------------------------ */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /* ------------------------
     * 🛠 Dev
     * ------------------------ */
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    /* ------------------------
     * 🪶 Lombok
     * ------------------------ */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
    }
}

generateGrammarSource {
    outputDirectory = file("${project.buildDir}/generated/sources/antlr/main/kr/or/kosa/backend/codenose/parser")
}

bootJar {
    mainClass = 'kr.or.kosa.backend.BackendApplication'
}

bootRun {
    mainClass = 'kr.or.kosa.backend.BackendApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}